name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
  GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate repository configuration
        run: |
          missing=0
          for name in PROJECT_ID REGION GAR_REPOSITORY SERVICE GCP_WIF_PROVIDER GCP_DEPLOY_SA GCP_RUNTIME_SA; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar la variable de repositorio $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package backend + frontend
        run: mvn -B verify

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 4 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --cpu-boost \
            --service-account "$GCP_RUNTIME_SA" \
            --set-env-vars "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75 -XX:+UseSerialGC" \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "URL: $URL"
          for attempt in $(seq 1 12); do
            ok=1
            for path in "/" "/built/bundle.js" "/built/css/app.css"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path" || true)
              if [ "$code" != "200" ]; then
                echo "Intento $attempt: $path respondió HTTP $code"
                ok=0
                break
              fi
            done
            if [ "$ok" = "1" ]; then
              echo "Smoke test OK: frontend y backend responden"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Smoke test falló; la revisión no sirvió el frontend o el backend"
          exit 1

      - name: Publish deploy summary
        if: always()
        run: |
          {
            echo "### Backend deploy"
            echo ""
            echo "- Imagen: \`$IMAGE:$GITHUB_SHA\`"
            echo "- Servicio: \`$SERVICE\` en \`$REGION\`"
          } >> "$GITHUB_STEP_SUMMARY"
