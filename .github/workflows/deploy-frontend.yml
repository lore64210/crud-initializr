name: Deploy frontend to Cloudflare Pages (optional)

# Por defecto el frontend se compila dentro del jar y se sirve desde Cloud Run.
# Este workflow queda solo para quien quiera publicar el frontend por separado.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate repository configuration
        env:
          API_URL: ${{ vars.API_URL }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=0
          if [ -z "$API_URL" ]; then
            echo "::error::Falta configurar la variable API_URL con la URL de Cloud Run."
            missing=1
          fi
          if [ -z "$PAGES_PROJECT" ]; then
            echo "::error::Falta configurar la variable CLOUDFLARE_PAGES_PROJECT."
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ vars.API_URL }}
        run: npm run build:pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

      - name: Publish deploy summary
        if: always()
        run: |
          {
            echo "### Frontend deploy"
            echo ""
            echo "- Proyecto: \`${{ vars.CLOUDFLARE_PAGES_PROJECT }}\`"
            echo "- API: \`${{ vars.API_URL }}\`"
            echo "- URL esperada: https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
